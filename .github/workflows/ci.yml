name: Windows build and release checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            output: dist/x86
          - arch: x64
            runner: windows-latest
            output: dist
          - arch: arm64
            runner: windows-11-arm
            output: dist/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      YP_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $expectedTag = 'v' + (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw 'Tag does not match VERSION' }
      - name: Download pinned compiler
        run: python bootstrap.py
      - name: Build DLL and run core tests
        run: ./build.ps1
      - name: Compare with Java Properties
        run: python tests/java_compat.py
      - name: Verify resource limits
        run: python tests/limits_test.py
      - name: Test plugin-list metadata generation
        run: python tests/plugin_list_test.py
      - name: Test release assembly
        run: python tests/assemble_release_test.py
      - name: Test official catalog PR automation
        run: python tests/catalog_pr_test.py
      - name: Download matching portable Notepad++
        run: |
          python tests/download_npp.py
          $folder = if ($env:YP_ARCH -eq 'x64') { '.runtime/npp-source' } else { ".runtime/$env:YP_ARCH/npp-source" }
          "NPP_TEST_DIR=$((Resolve-Path $folder).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test real editor integration
        run: python tests/smoke_plugin.py
      - name: Test installation and rollback
        run: python tests/installer_test.py
      - name: Package releases
        run: python package_release.py
      - name: Verify DLL version and release archives
        run: python tests/release_test.py
      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: YamlProperties-${{ matrix.arch }}-release-candidates
          path: |
            ${{ matrix.output }}/*.zip
            ${{ matrix.output }}/manifest.json
            ${{ matrix.output }}/checksums.json
          if-no-files-found: error
      - name: Upload validation records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-records-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: ignore

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: YamlProperties-*-release-candidates
          path: candidates
      - name: Verify and assemble all release attachments
        run: python scripts/assemble_release.py --candidates candidates --output release --notes release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "YamlProperties $RELEASE_TAG" \
            --notes-file notes/release-notes.md

  catalog:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/catalog.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      NPP_PLUGIN_LIST_TOKEN: ${{ secrets.NPP_PLUGIN_LIST_TOKEN }}
